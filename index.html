<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مهبد تکاپو</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .profile {
      background: #111b2e;
      border: 1px solid #263653;
      border-radius: 25px;
      padding: 35px 20px;
      margin-bottom: 25px;
    }

    .profile h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .profile p {
      color: #b8c3d6;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111b2e;
      border: 1px solid #263653;
      border-radius: 20px;
      padding: 30px 20px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #4da3ff;
    }

    .card h2 {
      margin-bottom: 12px;
      color: #4da3ff;
    }

    .card p {
      color: #c5cede;
      line-height: 1.8;
    }

    footer {
      margin-top: 35px;
      color: #7f8ba1;
    }
  </style>
</head>

<body>

  <div class="container">

    <section class="profile">
      <h1>مهبد تکاپو</h1>
      <p>برنامه‌نویس و علاقه‌مند به تکنولوژی 🚀</p>
    </section>

    <section class="cards">

      <div class="card">
        <h2>KidCode</h2>
        <p>
          فعالیت و یادگیری در زمینه برنامه‌نویسی و تکنولوژی
        </p>
      </div>

      <div class="card">
        <h2>Roboticup</h2>
        <p>
          علاقه‌مند به رباتیک، ساخت پروژه و فناوری
        </p>
      </div>

      <div class="card">
        <h2>مهارت‌ها</h2>
        <p>
          HTML<br>
          CSS<br>
          برنامه‌نویسی و طراحی وب
        </p>
      </div>

    </section>

    <footer>
      © 2026 Mahbod Takapoo
    </footer>

  </div>

</body>
</html>
